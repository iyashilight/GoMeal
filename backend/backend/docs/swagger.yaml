basePath: /
definitions:
  handler.addCartRequest:
    properties:
      food_id:
        type: integer
      merchant_id:
        type: integer
      quantity:
        type: integer
    required:
    - food_id
    - merchant_id
    - quantity
    type: object
  handler.updateCartRequest:
    properties:
      quantity:
        type: integer
    required:
    - quantity
    type: object
  service.AddressResponse:
    properties:
      address:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      name:
        type: string
      phone:
        type: string
      tag:
        type: string
    type: object
  service.CartItemResponse:
    properties:
      food_id:
        type: integer
      food_image:
        type: string
      food_name:
        type: string
      id:
        type: integer
      merchant:
        $ref: '#/definitions/service.MerchantResponse'
      merchant_id:
        type: integer
      price:
        type: number
      quantity:
        type: integer
    type: object
  service.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/service.CartItemResponse'
        type: array
      merchant:
        $ref: '#/definitions/service.MerchantResponse'
      merchant_id:
        type: integer
      total_price:
        type: number
      total_quantity:
        type: integer
    type: object
  service.CategoryWithFoods:
    properties:
      foods:
        items:
          $ref: '#/definitions/service.FoodResponse'
        type: array
      id:
        type: integer
      name:
        type: string
    type: object
  service.CreateAddressRequest:
    properties:
      address:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      phone:
        type: string
      tag:
        type: string
    required:
    - address
    - name
    - phone
    type: object
  service.CreateOrderRequest:
    properties:
      address_id:
        type: integer
      delivery_fee:
        type: number
      remark:
        type: string
    required:
    - address_id
    type: object
  service.FoodResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      old_price:
        type: number
      price:
        type: number
      sales:
        type: integer
      stock:
        type: integer
    type: object
  service.LoginRequest:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  service.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/service.UserInfoResponse'
    type: object
  service.MerchantDetailResponse:
    properties:
      address:
        type: string
      categories:
        items:
          $ref: '#/definitions/service.CategoryWithFoods'
        type: array
      delivery_fee:
        type: number
      id:
        type: integer
      logo:
        type: string
      min_price:
        type: number
      name:
        type: string
      notice:
        type: string
      phone:
        type: string
      rating:
        type: number
      sales:
        type: integer
      status:
        type: integer
    type: object
  service.MerchantResponse:
    properties:
      address:
        type: string
      delivery_fee:
        type: number
      id:
        type: integer
      logo:
        type: string
      min_price:
        type: number
      name:
        type: string
      notice:
        type: string
      phone:
        type: string
      rating:
        type: number
      sales:
        type: integer
      status:
        type: integer
    type: object
  service.OrderItemResponse:
    properties:
      food_id:
        type: integer
      food_image:
        type: string
      food_name:
        type: string
      price:
        type: number
      quantity:
        type: integer
    type: object
  service.OrderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/service.OrderResponse'
        type: array
      total:
        type: integer
    type: object
  service.OrderResponse:
    properties:
      created_at:
        type: string
      delivery_fee:
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/service.OrderItemResponse'
        type: array
      order_no:
        type: string
      remark:
        type: string
      status:
        type: integer
      total_amount:
        type: number
    type: object
  service.RegisterRequest:
    properties:
      password:
        minLength: 6
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  service.RegisterResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/service.UserInfoResponse'
    type: object
  service.UpdateAddressRequest:
    properties:
      address:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      phone:
        type: string
      tag:
        type: string
    type: object
  service.UserInfoResponse:
    properties:
      avatar:
        type: string
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      user_type:
        type: integer
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: 外卖订餐系统后端 API
  title: Ordering System API
  version: "1.0"
paths:
  /addresses:
    get:
      consumes:
      - application/json
      description: 获取当前用户的所有收货地址
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.AddressResponse'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取收货地址列表
      tags:
      - address
    post:
      consumes:
      - application/json
      description: 添加一个新的收货地址
      parameters:
      - description: 地址信息
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AddressResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 创建收货地址
      tags:
      - address
  /addresses/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的收货地址
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除收货地址
      tags:
      - address
    put:
      consumes:
      - application/json
      description: 修改指定的收货地址
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新信息
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.UpdateAddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AddressResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 更新收货地址
      tags:
      - address
  /addresses/{id}/default:
    put:
      consumes:
      - application/json
      description: 将指定地址设为默认收货地址
      parameters:
      - description: 地址 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 设置默认地址
      tags:
      - address
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用手机号和密码登录
      parameters:
      - description: 登录请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
      summary: 用户登录
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 使用手机号和密码注册
      parameters:
      - description: 注册请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.RegisterResponse'
              type: object
      summary: 用户注册
      tags:
      - auth
  /cart:
    get:
      consumes:
      - application/json
      description: 获取当前用户的购物车及商品列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.CartResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取购物车
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: 将商品添加到购物车
      parameters:
      - description: 添加请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/handler.addCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 添加购物车
      tags:
      - cart
  /cart/{id}:
    delete:
      consumes:
      - application/json
      description: 从购物车中移除指定商品
      parameters:
      - description: 购物车 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除购物车商品
      tags:
      - cart
    put:
      consumes:
      - application/json
      description: 更新购物车中指定商品的数量
      parameters:
      - description: 购物车 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/handler.updateCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新购物车商品数量
      tags:
      - cart
  /cart/clear:
    post:
      consumes:
      - application/json
      description: 清空当前用户的购物车
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 清空购物车
      tags:
      - cart
  /foods/{id}:
    get:
      consumes:
      - application/json
      description: 获取单个食品的详细信息
      parameters:
      - description: 食品 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.FoodResponse'
              type: object
      summary: 获取食品详情
      tags:
      - merchant
  /merchants:
    get:
      consumes:
      - application/json
      description: 获取所有营业中的商家
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.MerchantResponse'
                  type: array
              type: object
      summary: 获取商家列表
      tags:
      - merchant
  /merchants/{id}:
    get:
      consumes:
      - application/json
      description: 获取商家信息及分类、食品列表
      parameters:
      - description: 商家 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.MerchantDetailResponse'
              type: object
      summary: 获取商家详情
      tags:
      - merchant
  /orders:
    get:
      consumes:
      - application/json
      description: 获取当前用户的订单列表，支持按状态筛选和分页
      parameters:
      - description: 订单状态
        enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        in: query
        name: status
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.OrderListResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取订单列表
      tags:
      - order
    post:
      consumes:
      - application/json
      description: 提交当前购物车中的商品创建订单
      parameters:
      - description: 下单请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/service.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.OrderResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 创建订单
      tags:
      - order
  /orders/{id}:
    get:
      consumes:
      - application/json
      description: 获取指定订单的详细信息
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.OrderResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取订单详情
      tags:
      - order
  /orders/{id}/cancel:
    put:
      consumes:
      - application/json
      description: 取消指定订单（仅待支付状态可取消）
      parameters:
      - description: 订单 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - ApiKeyAuth: []
      summary: 取消订单
      tags:
      - order
  /user/info:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的个人信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserInfoResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户信息
      tags:
      - user
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
